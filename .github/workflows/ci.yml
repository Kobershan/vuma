name: CI

# docs/TESTING.md §6: build -> test -> migrate-check -> architecture-tests ->
# vulnerability-scan -> package. A red pipeline blocks a stage from being marked DONE.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Stage 08b: generate WPF ResourceDictionaries, Android Compose themes, and CSS
      # custom properties from design/tokens.json. Deterministic — regenerating produces
      # byte-identical output (see DesignSystemRulesTests.Generated_files_are_deterministic).
      - name: Generate design tokens
        run: dotnet run --project src/VumaRetail.TokenGenerator

      # Zero warnings in Domain and Application is a build failure there, not a report
      # (CLAUDE.md §7 rule 10 / Directory.Build.props).
      # Desktop projects target net9.0-windows and are excluded from the Linux build;
      # they are built in the package job on Windows-latest.
      # VumaRetail.Hardware targets net9.0 (cross-platform protocol layer) and IS built here.
      - name: Build
        run: |
          dotnet build src/VumaRetail.Domain -c Release --no-restore
          dotnet build src/VumaRetail.Application -c Release --no-restore
          dotnet build src/VumaRetail.Contracts -c Release --no-restore
          dotnet build src/VumaRetail.Infrastructure -c Release --no-restore
          dotnet build src/VumaRetail.Sync -c Release --no-restore
          dotnet build src/VumaRetail.Licensing -c Release --no-restore
          dotnet build src/VumaRetail.Workflow -c Release --no-restore
          dotnet build src/VumaRetail.Finance -c Release --no-restore
          dotnet build src/VumaRetail.Imports -c Release --no-restore
          dotnet build src/VumaRetail.Hardware -c Release --no-restore
          dotnet build src/VumaRetail.Web -c Release --no-restore
          dotnet build src/VumaRetail.PublicApi -c Release --no-restore
          dotnet build src/VumaRetail.StoreServer -c Release --no-restore
          dotnet build src/VumaRetail.CloudApi -c Release --no-restore
          dotnet build src/VumaRetail.TokenGenerator -c Release --no-restore
          dotnet build tests/VumaRetail.UnitTests -c Release --no-restore
          dotnet build tests/VumaRetail.ArchitectureTests -c Release --no-restore
          dotnet build tests/VumaRetail.IntegrationTests -c Release --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            src/**/bin/Release/
            tests/**/bin/Release/
            design/generated/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    # docs/TESTING.md §2 and CONVENTIONS.md §7: handler tests run against real PostgreSQL with real
    # migrations. A service container rather than Testcontainers-in-CI — same engine, one less
    # daemon in the loop, and the fixture takes VUMA_TEST_POSTGRES ahead of Docker (ADR-036).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vuma
          POSTGRES_PASSWORD: vuma
          POSTGRES_DB: vuma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vuma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # FIX 1: Changed Database=postgres to Database=vuma
      VUMA_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=vuma;Username=vuma;Password=vuma
      # FIX 1.5: Required by DesignTimeDbContextFactory for EF migration commands
      VUMA_MIGRATIONS_CONNECTION: Host=127.0.0.1;Port=5432;Database=vuma_migrate_check;Username=vuma;Password=vuma
      VUMA_REGISTRY_MIGRATIONS_CONNECTION: Host=127.0.0.1;Port=5432;Database=vuma_registry_migrate_check;Username=vuma;Password=vuma

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Stage 04's backup tests are R4's evidence: they take a real snapshot with pg_dump and
      # restore it into an empty database. pg_dump refuses to dump from a server newer than itself,
      # so a client/server major mismatch would surface as a puzzling backup-test failure rather
      # than as the environment problem it is. Fail here instead, with the versions in the log.
      # Create databases needed for stage 07c migrations
      - name: Create stage 07c databases
        run: |
          PGPASSWORD=vuma psql -h 127.0.0.1 -U vuma -d vuma -c "CREATE DATABASE vuma_migrate_check;" 2>/dev/null || true
          PGPASSWORD=vuma psql -h 127.0.0.1 -U vuma -d vuma -c "CREATE DATABASE vuma_registry_migrate_check;" 2>/dev/null || true

      - name: PostgreSQL client tools are present and not older than the server
        run: |
          set -euo pipefail
          if ! command -v pg_dump >/dev/null; then
            echo "::error::pg_dump is not installed. Stage 04's DR drill (R4) cannot run without it."
            exit 1
          fi
          client="$(pg_dump --version | grep -oE '[0-9]+' | head -1)"
          server="$(PGPASSWORD=vuma psql -h 127.0.0.1 -U vuma -d vuma -t -A -c 'SHOW server_version' | grep -oE '^[0-9]+')"
          echo "pg_dump major $client, server major $server"
          if [ "$client" -lt "$server" ]; then
            echo "::error::pg_dump $client cannot dump a PostgreSQL $server server."
            exit 1
          fi

      # FIX 3: Ensure dotnet-ef is installed for the migration step
      # Use the version matching the SDK to avoid compatibility issues
      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.11 || true
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet-ef --version

      # FIX 3b: Ensure dotnet-ef is on PATH for subsequent steps
      - name: Set PATH for dotnet tools
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # FIX 4a: Restore NuGet packages before EF commands
      - name: Restore
        run: dotnet restore src/VumaRetail.Infrastructure

      # FIX 4: Explicitly apply migrations before tests run to prevent 500 errors on empty DB
      - name: Apply Database Migrations for Tests
        run: |
          dotnet ef database update --project src/VumaRetail.Infrastructure --context VumaRetailDbContext
          # Stage 07c: Registry context also needs migrations applied
          dotnet ef database update --project src/VumaRetail.Infrastructure --context VumaRegistryDbContext

      # Stage 07c: Ensure registry migrations are reversible too
      - name: Verify registry migrations are reversible
        run: |
          dotnet ef database update 0 --project src/VumaRetail.Infrastructure --context VumaRegistryDbContext
          dotnet ef database update --project src/VumaRetail.Infrastructure --context VumaRegistryDbContext

      - name: Test
        run: |
          dotnet test tests/VumaRetail.UnitTests -c Release --no-restore
          dotnet test tests/VumaRetail.ArchitectureTests -c Release --no-restore
          dotnet test tests/VumaRetail.IntegrationTests -c Release --no-restore --logger "trx;LogFileName=results.trx" --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory ./artifacts/test-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test-results
          retention-days: 7

  architecture-tests:
    name: Architecture tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The CLAUDE.md §7 rules that a project reference cannot express: layering through
      # transitive dependencies, the PublicApi isolation (rule 14), and the command
      # side-effect classification read-only enforcement depends on (rule 15).
      - name: Run architecture tests
        run: dotnet test tests/VumaRetail.ArchitectureTests -c Release

  design-system-verification:
    name: Design System Verification
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Verify token generation is deterministic: regenerate and compare to existing output
      - name: Verify token generation is deterministic
        run: |
          dotnet run --project src/VumaRetail.TokenGenerator
          # Compare regenerated output to committed output — must be byte-identical
          if ! git diff --quiet design/generated/ design/tokens.css; then
            echo "::error::Token regeneration produced different output — generation is not deterministic."
            exit 1
          fi

      # Verify contrast ratios meet WCAG AA/AAA requirements
      - name: Verify contrast ratios
        run: dotnet test tests/VumaRetail.ArchitectureTests --filter "FullyQualifiedName~ContrastAndTypographyTests" -c Release

      # Verify no literal hex values in XAML/Kotlin/CSS outside generated files
      - name: Verify no literal hex colours in source
        run: dotnet test tests/VumaRetail.ArchitectureTests --filter "FullyQualifiedName~DesignSystemRulesTests" -c Release

      # Verify hand-edited generated files fail the build
      - name: Verify hand-edited generated files fail
        run: dotnet test tests/VumaRetail.ArchitectureTests --filter "FullyQualifiedName~DesignSystemRulesTests.Hand_edited_generated_file_fails_the_build" -c Release

      # Verify fonts are embedded and no runtime download
      - name: Verify fonts embedded
        run: dotnet test tests/VumaRetail.ArchitectureTests --filter "FullyQualifiedName~ContrastAndTypographyTests.Fonts_embedded_no_runtime_download" -c Release

  migrate-check:
    name: Migration check
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vuma
          POSTGRES_PASSWORD: vuma
          POSTGRES_DB: vuma_migrate_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vuma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      VUMA_MIGRATIONS_CONNECTION: Host=127.0.0.1;Port=5432;Database=vuma_migrate_check;Username=vuma;Password=vuma

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # FIX 3: Ensure dotnet-ef is installed for the migration step
      # Use the version matching the SDK to avoid compatibility issues
      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.11 || true
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet-ef --version

      # FIX 3b: Ensure dotnet-ef is on PATH for subsequent steps
      - name: Set PATH for dotnet tools
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # FIX 4c: Restore NuGet packages before EF commands
      - name: Restore
        run: dotnet restore src/VumaRetail.Infrastructure

      # docs/TESTING.md §6. A model change without a scaffolded migration builds, tests green, and
      # then fails on a customer's database during an upgrade.
      - name: Model and migrations agree
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/VumaRetail.Infrastructure --context VumaRetailDbContext

      # Stage 07c: Also check registry context for pending model changes
      - name: Registry model and migrations agree
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/VumaRetail.Infrastructure --context VumaRegistryDbContext

      - name: Apply to an empty database
        run: dotnet ef database update --project src/VumaRetail.Infrastructure --context VumaRetailDbContext

      # Stage 07c: Also apply registry context migrations
      - name: Apply Registry Migrations
        run: dotnet ef database update --project src/VumaRetail.Infrastructure --context VumaRegistryDbContext

      # CLAUDE.md §8 requires Down to be reversible, and a Down that was never run is a Down that
      # does not work. "0" is EF's name for the state before the first migration.
      - name: Reverse every migration
        run: dotnet ef database update 0 --project src/VumaRetail.Infrastructure --context VumaRetailDbContext

      # Stage 07c: Also verify registry migrations are reversible
      - name: Reverse every registry migration
        run: dotnet ef database update 0 --project src/VumaRetail.Infrastructure --context VumaRegistryDbContext

      - name: Re-apply
        run: dotnet ef database update --project src/VumaRetail.Infrastructure --context VumaRetailDbContext

      # Stage 07c: Re-apply registry migrations
      - name: Re-apply Registry Migrations
        run: dotnet ef database update --project src/VumaRetail.Infrastructure --context VumaRegistryDbContext

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Fail on vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee scan.log
          if grep -q "has the following vulnerable packages" scan.log; then
            echo "::error::Vulnerable packages found."
            exit 1
          fi

  package:
    name: Package
    runs-on: windows-latest
    needs: [test, architecture-tests, design-system-verification, migrate-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Build the full solution including the Windows-only Desktop projects.
      # Restore first: this job runs on a fresh runner with no shared artifacts from build.
      - name: Restore
        run: dotnet restore VumaRetail.sln

      - name: Build full solution
        run: dotnet build VumaRetail.sln -c Release --no-restore

      - name: Publish self-contained WPF desktop client
        run: >-
          dotnet publish src/VumaRetail.Desktop/VumaRetail.Desktop.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/desktop-win-single

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable

      - name: Test Flutter client
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Android APK and Windows Flutter client
        working-directory: mobile
        run: |
          flutter build apk --release --dart-define=VUMA_API_BASE_URL=${{ secrets.VUMA_API_BASE_URL }}
          flutter build windows --release --dart-define=VUMA_API_BASE_URL=${{ secrets.VUMA_API_BASE_URL }}

      # Run the token generator to ensure generated files are up to date.
      # PowerShell syntax: this job runs on windows-latest (bash subshell syntax fails here).
      - name: Regenerate tokens and verify
        run: |
          dotnet run --project src/VumaRetail.TokenGenerator
          # Verify no hand-edits — generated files must match
          git diff --quiet design/generated/ design/tokens.css
          if ($LASTEXITCODE -ne 0) { echo "::error::Generated files differ from committed output"; exit 1 }

      - name: Package
        run: echo "WPF .exe, Flutter APK, and Flutter Windows artifacts are built; installer signing remains deployment-specific."

      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vuma-client-builds
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/windows/runner/Release/**
            src/VumaRetail.Desktop/bin/Release/**
            artifacts/desktop-win-single/**
