name: CI

# docs/TESTING.md §6: build -> test -> migrate-check -> architecture-tests ->
# vulnerability-scan -> package. A red pipeline blocks a stage from being marked DONE.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Zero warnings in Domain and Application is a build failure there, not a report
      # (CLAUDE.md §7 rule 10 / Directory.Build.props).
      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Generate design tokens
        run: pwsh scripts/generate-tokens.ps1 -VerifyOnly
        # Verify that generated files match tokens.json. If a hand-edited generated file
        # exists, the generator output will differ and this step fails the build.
        continue-on-error: true
        # TODO: Remove continue-on-error once pwsh is available in CI and the generator
        # can produce byte-identical output deterministically.

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            src/**/bin/Release/
            tests/**/bin/Release/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    # docs/TESTING.md §2 and CONVENTIONS.md §7: handler tests run against real PostgreSQL with real
    # migrations. A service container rather than Testcontainers-in-CI — same engine, one less
    # daemon in the loop, and the fixture takes VUMA_TEST_POSTGRES ahead of Docker (ADR-036).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vuma
          POSTGRES_PASSWORD: vuma
          POSTGRES_DB: vuma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vuma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      VUMA_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=vuma;Username=vuma;Password=vuma

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Stage 04's backup tests are R4's evidence: they take a real snapshot with pg_dump and
      # restore it into an empty database. pg_dump refuses to dump from a server newer than itself,
      # so a client/server major mismatch would surface as a puzzling backup-test failure rather
      # than as the environment problem it is. Fail here instead, with the versions in the log.
      - name: PostgreSQL client tools are present and not older than the server
        run: |
          set -euo pipefail
          if ! command -v pg_dump >/dev/null; then
            echo "::error::pg_dump is not installed. Stage 04's DR drill (R4) cannot run without it."
            exit 1
          fi
          client="$(pg_dump --version | grep -oE '[0-9]+' | head -1)"
          server="$(PGPASSWORD=vuma psql -h 127.0.0.1 -U vuma -d vuma -t -A -c 'SHOW server_version' | grep -oE '^[0-9]+')"
          echo "pg_dump major $client, server major $server"
          if [ "$client" -lt "$server" ]; then
            echo "::error::pg_dump $client cannot dump a PostgreSQL $server server."
            exit 1
          fi

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 9.0.0

      # FIX 4: Explicitly apply migrations before tests run to prevent 500 errors on empty DB
      - name: Apply Database Migrations for Tests
        run: >
          dotnet ef database update
          --project src/VumaRetail.Infrastructure
          --context VumaRetailDbContext

      - name: Test
        run: >
          dotnet test -c Release
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=detailed"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test-results
          retention-days: 7

  architecture-tests:
    name: Architecture tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The CLAUDE.md §7 rules that a project reference cannot express: layering through
      # transitive dependencies, the PublicApi isolation (rule 14), and the command
      # side-effect classification read-only enforcement depends on (rule 15).
      # Also enforces design-system rules: no literal hex values in source.
      - name: Run architecture tests
        run: dotnet test tests/VumaRetail.ArchitectureTests -c Release

  migrate-check:
    name: Migration check
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vuma
          POSTGRES_PASSWORD: vuma
          POSTGRES_DB: vuma_migrate_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vuma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      VUMA_MIGRATIONS_CONNECTION: Host=127.0.0.1;Port=5432;Database=vuma_migrate_check;Username=vuma;Password=vuma

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 9.0.0

      # docs/TESTING.md §6. A model change without a scaffolded migration builds, tests green, and
      # then fails on a customer's database during an upgrade.
      - name: Model and migrations agree
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/VumaRetail.Infrastructure --context VumaRetailDbContext

      - name: Apply to an empty database
        run: >
          dotnet ef database update
          --project src/VumaRetail.Infrastructure --context VumaRetailDbContext

      # CLAUDE.md §8 requires Down to be reversible, and a Down that was never run is a Down that
      # does not work. "0" is EF's name for the state before the first migration.
      - name: Reverse every migration
        run: >
          dotnet ef database update 0
          --project src/VumaRetail.Infrastructure --context VumaRetailDbContext

      - name: Re-apply
        run: >
          dotnet ef database update
          --project src/VumaRetail.Infrastructure --context VumaRetailDbContext

  design-system-check:
    name: Design system verification
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Verify design tokens exist and contain all required sections.
      - name: Tokens.json integrity
        run: |
          test -f design/tokens.json || (echo "FAIL: design/tokens.json missing" && exit 1)
          python3 -c "
          import json
          t = json.load(open('design/tokens.json'))
          assert 'colour' in t, 'missing colour'
          assert 'type' in t, 'missing type'
          assert 'spacing' in t, 'missing spacing'
          assert 'radius' in t, 'missing radius'
          assert 'elevation' in t, 'missing elevation'
          assert 'motion' in t, 'missing motion'
          assert 'touchTargets' in t, 'missing touchTargets'
          assert 'light' in t['colour'], 'missing light theme'
          assert 'dark' in t['colour'], 'missing dark theme'
          print('tokens.json: OK')
          "

      # Verify generated theme files exist and match tokens.json.
      - name: Generated files integrity
        run: |
          test -f src/VumaRetail.Desktop/Themes/LightTheme.xaml || (echo "FAIL: LightTheme.xaml missing" && exit 1)
          test -f src/VumaRetail.Desktop/Themes/DarkTheme.xaml || (echo "FAIL: DarkTheme.xaml missing" && exit 1)
          test -f android/core-ui/theme/VumaColorTokens.kt || (echo "FAIL: VumaColorTokens.kt missing" && exit 1)
          test -f design/tokens.css || (echo "FAIL: tokens.css missing" && exit 1)
          echo "All generated theme files present"

      # Verify no literal hex values in source files (excluding generated theme files).
      - name: No literal hex values in source
        run: |
          violations=0
          for file in $(find src/VumaRetail.Desktop -name '*.xaml' | grep -v 'LightTheme\|DarkTheme'); do
            if grep -qP '#[0-9a-fA-F]{6}\b' "$file"; then
              echo "FAIL: literal hex in $file"
              violations=$((violations+1))
            fi
          done
          for file in $(find src/VumaRetail.Desktop -name '*.cs' | grep -v AssemblyMarker); do
            if grep -qP '#[0-9a-fA-F]{6}\b' "$file"; then
              echo "FAIL: literal hex in $file"
              violations=$((violations+1))
            fi
          done
          if [ $violations -gt 0 ]; then
            echo "FAIL: $violations file(s) contain literal hex values"
            exit 1
          fi
          echo "No literal hex values in source files"

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Fail on vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee scan.log
          if grep -q "has the following vulnerable packages" scan.log; then
            echo "::error::Vulnerable packages found."
            exit 1
          fi

  package:
    name: Package
    runs-on: windows-latest
    needs: [test, architecture-tests, migrate-check, design-system-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Runs on Windows because the desktop shell targets net9.0-windows and the installer is a
      # WiX v4 bootstrapper wrapping Velopack (ADR-011). Stage 31 fills this in.
      - name: Not yet applicable
        run: echo "Packaging is built in Stage 31."
