services:
  - type: web
    name: vuma-cloud-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.cloudapi
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Registry
        sync: false
      - key: ConnectionStrings__Vuma
        sync: false
      - key: Vuma__Jwt__SigningKey
        sync: false
      - key: Vuma__Backup__Encryption__Key
        sync: false

databases:
  - name: vuma-postgres
    plan: free
    region: frankfurt
    databaseName: vuma_cloud
    user: vuma
    postgresMajorVersion: "17"
