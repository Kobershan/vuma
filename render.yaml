services:
  # DEMO/DEVELOPMENT BLUEPRINT — do not use this file as the production deployment.
  # Production must use persistent, non-free service/database plans, configured backups,
  # retention, monitoring and restore procedures. Keep those choices in the operator's
  # private Render environment rather than hard-coding a commercial tier here.
  - type: web
    name: vuma-cloud-api-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.cloudapi
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Registry
        sync: false
      - key: ConnectionStrings__Vuma
        sync: false
      - key: Vuma__Jwt__SigningKey
        sync: false
      - key: Vuma__Loyalty__Public__WebhookSecret
        sync: false
      - key: AllowedHosts
        sync: false
      - key: Vuma__Jwt__CorsAllowedOrigins__0
        sync: false
      - key: Vuma__Backup__Encryption__Key
        sync: false

databases:
  # Demo-only database. Production requires a persistent plan and an independent backup policy.
  - name: vuma-postgres-demo
    plan: free
    region: frankfurt
    databaseName: vuma_cloud
    user: vuma
    postgresMajorVersion: "17"
